<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TARIG Hotel Booking</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


<div class="auth-container">

    <div class="auth-logo">

        TARIG 🇸🇩

    </div>


    <h1>Hotel Booking</h1>

    <p class="auth-subtitle">
        Hotels in Gedaref, Sudan
    </p>


    <!-- LOGIN -->

    <div id="loginForm">

        <h2>Login</h2>


        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >


        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >


        <button
            onclick="loginUser()"
            class="primary-btn"
        >
            Login
        </button>


        <p id="loginMessage"></p>


        <p class="switch-text">

            Don't have an account?

            <button
                onclick="showRegister()"
                class="link-btn"
            >
                Register
            </button>

        </p>

    </div>


    <!-- REGISTER -->

    <div
        id="registerForm"
        style="display:none;"
    >

        <h2>Create Account</h2>


        <input
            type="text"
            id="registerName"
            placeholder="Full Name"
        >


        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >


        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >


        <button
            onclick="registerUser()"
            class="primary-btn"
        >
            Register
        </button>


        <p id="registerMessage"></p>


        <p class="switch-text">

            Already have an account?

            <button
                onclick="showLogin()"
                class="link-btn"
            >
                Login
            </button>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
